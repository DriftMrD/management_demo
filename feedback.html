<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户反馈</title>
  <link rel="stylesheet" href="styles.css?v=20260811fb9" />
</head>
<body>
  <div class="home-shell feedback-shell">
    <aside class="home-sidebar" id="home-sidebar" aria-label="项目管理导航">
      <div class="home-sidebar-top">
        <a class="home-sidebar-title" href="index.html">项目管理</a>
        <button type="button" class="home-collapse-btn" id="home-collapse-btn" aria-label="收起导航" aria-expanded="true">
          <img src="assets/icons/chevron-down.svg" alt="" class="home-collapse-icon" />
        </button>
      </div>
      <nav class="home-sidebar-nav">
        <a class="home-nav-item" href="requirements.html">需求管理系统</a>
        <a class="home-nav-item" href="iteration.html">迭代管理系统</a>
        <a class="home-nav-item active" href="version.html">版本管理平台</a>
      </nav>
    </aside>

    <div class="home-main-panel feedback-main">
      <header class="feedback-page-header">
        <nav class="breadcrumb">
          <a class="crumb crumb-link" href="index.html">项目管理</a>
          <img class="crumb-sep" src="assets/icons/chevron-right.svg" alt="" />
          <a class="crumb crumb-link" href="version.html">版本管理平台</a>
          <img class="crumb-sep" src="assets/icons/chevron-right.svg" alt="" />
          <span class="crumb current">用户反馈</span>
        </nav>

        <div class="title-row">
          <div class="title-left">
            <h1>用户反馈</h1>
            <p>收集、处理、归纳并追踪全渠道的用户真实原声及产品体验问题</p>
          </div>
          <div class="feedback-header-actions">
            <div class="view-toggle" id="feedback-view-toggle" role="group" aria-label="视图切换">
              <button type="button" class="toggle-btn active" data-view="week">周报</button>
              <button type="button" class="toggle-btn" data-view="data">数据</button>
            </div>
            <div class="filter-btn-wrap feedback-product-filter">
              <button class="filter-btn feedback-product-btn" id="feedback-product-btn" type="button">
                <span><b id="feedback-product-value">全部</b></span>
                <img src="assets/icons/chevron-down.svg" alt="" class="filter-chevron" />
              </button>
              <div class="dropdown" id="feedback-product-dropdown" hidden></div>
            </div>
          </div>
        </div>
      </header>

      <div class="feedback-body">
        <section class="feedback-pane" id="pane-week">
          <div class="feedback-table-card">
            <div class="feedback-table-scroll">
              <div class="feedback-table-header feedback-week-header">
                <div class="fb-th fb-w-period">周期</div>
                <div class="fb-th fb-w-product">产品</div>
                <div class="fb-th fb-w-num">反馈总量</div>
                <div class="fb-th fb-w-num">有效总量</div>
                <div class="fb-th fb-w-sent">
                  <span class="sent-neg">负面</span>
                  <span class="sent-sep">/</span>
                  <span class="sent-demand">需求</span>
                  <span class="sent-sep">/</span>
                  <span class="sent-pos">正面</span>
                </div>
                <div class="fb-th fb-w-gp">GP</div>
                <div class="fb-th fb-w-cms">CMS</div>
                <div class="fb-th fb-w-issue">核心问题</div>
                <div class="fb-th fb-w-action">操作</div>
              </div>
              <div class="feedback-table-body" id="week-table-body"></div>
            </div>
          </div>

          <footer class="pagination-bar feedback-pagination-bar">
            <span id="feedback-total-count">共 0 条反馈周期记录</span>
            <div class="pagination" id="feedback-pagination"></div>
          </footer>
        </section>

        <section class="feedback-pane" id="pane-data" hidden>
          <div class="fb-data-kpis" id="fb-data-kpis"></div>

          <div class="fb-data-charts">
            <div class="fb-data-chart-card">
              <h3 class="fb-data-chart-title">转化状态分布</h3>
              <div class="fb-data-donut-row" id="fb-conv-chart"></div>
            </div>
            <div class="fb-data-chart-card">
              <h3 class="fb-data-chart-title">进度分布</h3>
              <div class="fb-data-donut-row" id="fb-progress-chart"></div>
            </div>
          </div>

          <div class="fb-data-table-card">
            <div class="fb-data-toolbar">
              <div class="search-box fb-data-search">
                <img src="assets/icons/search.svg" alt="" />
                <input type="search" id="fb-data-search" placeholder="搜索问题点..." autocomplete="off" />
              </div>
              <div class="fb-data-filters">
                <div class="filter-btn-wrap">
                  <button class="filter-btn" id="fb-cat-btn" type="button">
                    <span>反馈分类: <b id="fb-cat-value">全部</b></span>
                    <img src="assets/icons/chevron-down.svg" alt="" class="filter-chevron" />
                  </button>
                  <div class="dropdown" id="fb-cat-dropdown" hidden></div>
                </div>
                <div class="filter-btn-wrap">
                  <button class="filter-btn" id="fb-conv-btn" type="button">
                    <span>转化状态: <b id="fb-conv-value">全部</b></span>
                    <img src="assets/icons/chevron-down.svg" alt="" class="filter-chevron" />
                  </button>
                  <div class="dropdown" id="fb-conv-dropdown" hidden></div>
                </div>
                <div class="filter-btn-wrap">
                  <button class="filter-btn" id="fb-prog-btn" type="button">
                    <span>进度: <b id="fb-prog-value">全部</b></span>
                    <img src="assets/icons/chevron-down.svg" alt="" class="filter-chevron" />
                  </button>
                  <div class="dropdown" id="fb-prog-dropdown" hidden></div>
                </div>
              </div>
            </div>

            <div class="feedback-table-scroll">
              <div class="feedback-table-header fb-data-header">
                <div class="fb-th fb-d-cat">反馈分类</div>
                <div class="fb-th fb-d-product">所属产品</div>
                <div class="fb-th fb-d-name">问题点名称</div>
                <div class="fb-th fb-d-sev">严重度</div>
                <div class="fb-th fb-d-conv">转化状态</div>
                <div class="fb-th fb-d-prog">进度</div>
              </div>
              <div class="feedback-table-body" id="data-table-body"></div>
            </div>

            <footer class="pagination-bar feedback-pagination-bar fb-data-pagination-bar">
              <span id="fb-data-total-count">共 0 条问题点</span>
              <div class="pagination" id="fb-data-pagination"></div>
            </footer>
          </div>
        </section>
      </div>
    </div>
  </div>

  <div class="toast" id="feedback-toast" hidden role="status"></div>

  <script src="feedback-data.js?v=20260811fb8"></script>
  <script src="feedback.js?v=20260811fb8"></script>
  <script src="auth.js?v=20260812auth5"></script>
</body>
</html>
