<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI提效进展</title>
  <link rel="stylesheet" href="styles.css?v=20260728p" />
</head>
<body>
  <div class="page progress-page">
    <nav class="breadcrumb">
      <a class="crumb crumb-link" href="index.html">项目管理</a>
      <img class="crumb-sep" src="assets/icons/chevron-right.svg" alt="" />
      <a class="crumb crumb-link" href="requirements.html">需求管理系统</a>
      <img class="crumb-sep" src="assets/icons/chevron-right.svg" alt="" />
      <a class="crumb crumb-link" href="efficiency.html">AI提效看板</a>
      <img class="crumb-sep" src="assets/icons/chevron-right.svg" alt="" />
      <span class="crumb current">提效进展</span>
    </nav>

    <header class="progress-header">
      <div class="progress-title-row">
        <h1>AI提效进展</h1>
        <div class="view-toggle" id="progress-tab-toggle" role="group" aria-label="进展视图切换">
          <button type="button" class="toggle-btn active" data-tab="req">按需求</button>
          <button type="button" class="toggle-btn" data-tab="deliverable">按交付物</button>
        </div>
      </div>
      <p>按周查看 AI 提效进展：按需求看全貌与跟进，按交付物看产出物更新切片</p>
    </header>

    <div class="progress-controls">
      <div class="progress-controls-left">
        <div class="week-selector" id="week-selector">
          <button type="button" class="week-nav-btn" id="week-prev" aria-label="上一周">←</button>
          <button type="button" class="week-label-btn" id="week-label-btn" aria-haspopup="listbox" aria-expanded="false">
            <span class="week-label" id="week-label">2026年 第29周（7.14 - 7.20）</span>
            <img class="week-label-chevron" src="assets/icons/chevron-down.svg" alt="" />
          </button>
          <button type="button" class="week-nav-btn" id="week-next" aria-label="下一周">→</button>
          <div class="dropdown week-dropdown" id="week-dropdown" hidden role="listbox"></div>
        </div>
        <div class="progress-week-summary" id="week-summary">本周变更 0 项，涉及 0 项需求</div>
      </div>
      <div class="progress-controls-right">
        <div class="progress-status-legend" id="progress-status-legend" hidden>
          <span class="progress-legend-item"><i class="progress-swatch is-add"></i>新增</span>
          <span class="progress-legend-item"><i class="progress-swatch is-update"></i>更新</span>
        </div>
      </div>
    </div>

    <section class="progress-view" id="progress-req-view">
      <div class="progress-req-table-outer">
        <div class="progress-req-table-wrap">
          <div class="progress-req-header">
            <div class="pth col-req-title">需求名称</div>
            <div class="pth col-req-product">所属产品</div>
            <div class="pth col-req-status">进展状态</div>
            <div class="pth col-req-prd">AI PRD</div>
            <div class="pth col-req-feedback">研发反馈</div>
            <div class="pth col-req-demo">AI Demo</div>
            <div class="pth col-req-duration">Demo时长</div>
            <div class="pth col-req-track">AI埋点</div>
            <div class="pth col-req-followup">跟进说明</div>
          </div>
          <div class="progress-req-body" id="progress-req-tbody"></div>
        </div>
      </div>
    </section>

    <section class="progress-view" id="progress-deliverable-view" hidden>
      <div class="progress-sections" id="week-sections"></div>
    </section>
  </div>

  <div class="modal-overlay" id="progress-feedback-modal" hidden>
    <div class="modal eff-feedback-modal" role="dialog" aria-modal="true" aria-labelledby="progress-feedback-title">
      <div class="modal-header">
        <h2 id="progress-feedback-title">研发对AI PRD的反馈</h2>
        <button class="modal-close" id="progress-feedback-close" type="button" aria-label="关闭">
          <img src="assets/icons/x-circle.svg" alt="" />
        </button>
      </div>
      <div class="eff-feedback-context">
        需求：<strong id="progress-feedback-req-title"></strong>
      </div>
      <div class="modal-body eff-feedback-body" id="progress-feedback-list"></div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" id="progress-feedback-ok">关闭</button>
        <button type="button" class="btn-primary" id="progress-feedback-add" disabled title="暂不支持添加反馈">
          <img src="assets/icons/plus.svg" alt="" />
          <span>添加反馈</span>
        </button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="progress-followup-modal" hidden>
    <div class="modal eff-feedback-modal weekly-note-modal" role="dialog" aria-modal="true" aria-labelledby="progress-followup-title">
      <div class="modal-header">
        <h2 id="progress-followup-title">跟进说明</h2>
        <button class="modal-close" id="progress-followup-close" type="button" aria-label="关闭">
          <img src="assets/icons/x-circle.svg" alt="" />
        </button>
      </div>
      <div class="eff-feedback-context">
        需求：<strong id="progress-followup-req-title"></strong>
      </div>
      <div class="modal-body weekly-note-body">
        <div class="field">
          <label class="field-label" for="progress-followup-content">跟进说明</label>
          <textarea class="field-textarea" id="progress-followup-content" rows="6" placeholder="记录周会结论、处理动作、责任人等"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" id="progress-followup-cancel">取消</button>
        <button type="button" class="btn-primary" id="progress-followup-save">保存</button>
      </div>
    </div>
  </div>

  <script src="data.js?v=20260728a"></script>
  <script src="progress.js?v=20260728o"></script>
  <script src="auth.js?v=20260812auth5"></script>
</body>
</html>
