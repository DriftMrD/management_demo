<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>需求管理系统</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="home-shell">
    <aside class="home-sidebar" id="home-sidebar" aria-label="项目管理导航">
      <div class="home-sidebar-top">
        <a class="home-sidebar-title" href="index.html">项目管理</a>
        <button type="button" class="home-collapse-btn" id="home-collapse-btn" aria-label="收起导航" aria-expanded="true">
          <img src="assets/icons/chevron-down.svg" alt="" class="home-collapse-icon" />
        </button>
      </div>
      <nav class="home-sidebar-nav">
        <a class="home-nav-item active" href="requirements.html">需求管理系统</a>
        <a class="home-nav-item" href="iteration.html">迭代管理系统</a>
        <a class="home-nav-item" href="version.html">版本管理平台</a>
      </nav>
    </aside>

    <div class="home-main-panel">
      <header class="home-main-header">
        <nav class="breadcrumb home-breadcrumb">
          <a class="crumb crumb-link" href="index.html">项目管理</a>
          <img class="crumb-sep" src="assets/icons/chevron-right.svg" alt="" />
          <span class="crumb current">需求管理系统</span>
        </nav>
        <div class="home-intro">
          <h1>需求管理系统</h1>
          <p>跨产品线需求全生命周期管理平台，覆盖需求池看板、排期、甘特、开发、验收全流程</p>
        </div>
      </header>

      <main class="home-main-body">
        <h2 class="home-section-label">系统功能模块</h2>
        <section class="home-module-row" aria-label="功能模块">
          <a class="home-module-card" href="pool.html">
            <div class="home-module-top">
              <div class="home-module-title-row">
                <img src="assets/icons/layout-dashboard.svg" alt="" />
                <h3>需求池看板</h3>
              </div>
              <p>汇总、筛选、管理团队全线产品的全量需求任务</p>
            </div>
            <div class="home-module-bottom">
              <span class="home-stat-badge" id="pool-count-badge">0条需求</span>
              <span class="home-module-enter">进入模块 &gt;</span>
            </div>
          </a>

          <a class="home-module-card" href="efficiency.html">
            <div class="home-module-top">
              <div class="home-module-title-row">
                <img src="assets/icons/ai-brain.svg" alt="" />
                <h3>AI提效看板</h3>
              </div>
              <p>聚合所有含AI产出物的需求，AI PRD/Demo/埋点专项追踪</p>
            </div>
            <div class="home-module-bottom">
              <span class="home-stat-badge" id="efficiency-count-badge">0条需求</span>
              <span class="home-module-enter">进入模块 &gt;</span>
            </div>
          </a>

          <a class="home-module-card" href="weekly.html">
            <div class="home-module-top">
              <div class="home-module-title-row">
                <img src="assets/icons/list.svg" alt="" />
                <h3>需求周进展看板</h3>
              </div>
              <p>按周追踪全部需求进展、风险项与运营事项</p>
            </div>
            <div class="home-module-bottom">
              <span class="home-stat-badge" id="weekly-count-badge">0条需求</span>
              <span class="home-module-enter">进入模块 &gt;</span>
            </div>
          </a>

          <a class="home-module-card" href="design.html">
            <div class="home-module-top">
              <div class="home-module-title-row">
                <img src="assets/icons/pencil.svg" alt="" />
                <h3>需求设计看板</h3>
              </div>
              <p>需求设计相关工作一览</p>
            </div>
            <div class="home-module-bottom">
              <span class="home-stat-badge" id="design-count-badge">0条需求</span>
              <span class="home-module-enter">进入模块 &gt;</span>
            </div>
          </a>
        </section>
      </main>
    </div>
  </div>

  <script src="data.js?v=20260723doc1"></script>
  <script>
    document.getElementById("pool-count-badge").textContent = `${getPoolRows().length}条需求`;
    document.getElementById("efficiency-count-badge").textContent = `${getAiEfficiencyRows().length}条需求`;
    document.getElementById("weekly-count-badge").textContent = `${getPoolRows().length}条需求`;
    document.getElementById("design-count-badge").textContent = `${getDesignBoardRows().length}条需求`;

    const sidebar = document.getElementById("home-sidebar");
    const collapseBtn = document.getElementById("home-collapse-btn");
    collapseBtn.addEventListener("click", () => {
      const collapsed = sidebar.classList.toggle("collapsed");
      collapseBtn.setAttribute("aria-expanded", String(!collapsed));
      collapseBtn.setAttribute("aria-label", collapsed ? "展开导航" : "收起导航");
    });
  </script>
</body>
</html>
